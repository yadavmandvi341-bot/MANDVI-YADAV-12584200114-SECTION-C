<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task 10 — Product API + CSR | Mandvi Yadav</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Product Catalog (Client-Side Rendering)</h1>
      <p>Fetching &amp; mutating <code>/api/products</code> — Mandvi Yadav</p>
    </header>

    <section class="form-card">
      <h2>Add New Product</h2>
      <form id="product-form" class="form-grid">
        <input type="text" id="name" placeholder="Product Name" required />
        <input type="number" id="price" placeholder="Price (₹)" min="0" step="0.01" required />
        <input type="number" id="rating" placeholder="Rating (0 - 5)" min="0" max="5" step="0.1" required />
        <button type="submit">Add Product</button>
      </form>
    </section>

    <section>
      <h2>All Products</h2>
      <div id="products-grid" class="grid"></div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
